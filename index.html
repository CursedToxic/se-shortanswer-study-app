<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb">
<meta name="description" content="Study app for the NESA Software Engineering 11–12 (2022) syllabus: dot-point mastery tracking, inline Python and JavaScript execution, HSC exam simulation, major project portfolio, and gamified progression.">
<title>SE Ops — NESA Software Engineering 11–12</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%232f6bff'/><text x='50' y='68' font-size='54' font-family='system-ui' font-weight='700' fill='white' text-anchor='middle'>SE</text></svg>">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="field" aria-hidden="true"><i></i><i></i><i></i></div>
<a class="skip" href="#main">Skip to content</a>

<div class="app">

  <!-- ------------------------------------------------- desktop rail -->
  <aside class="rail glass" aria-label="Primary">
    <div class="brand">
      <div class="mark" aria-hidden="true">SE</div>
      <div>
        <b>SE Ops</b>
        <span>Software Engineering 11–12</span>
      </div>
    </div>

    <div class="zoneswitch" role="group" aria-label="Course year">
      <button type="button" data-year="11">Year 11</button>
      <button type="button" data-year="12">Year 12</button>
    </div>

    <nav class="nav">
      <a href="#/dashboard"   data-nav="dashboard"><span class="ic" aria-hidden="true">◉</span> Dashboard</a>
      <a href="#/syllabus"    data-nav="syllabus"><span class="ic" aria-hidden="true">▤</span> Syllabus map</a>

      <div class="sep">Practise</div>
      <a href="#/lab"         data-nav="lab"><span class="ic" aria-hidden="true">⌨</span> Code lab</a>
      <a href="#/exam"        data-nav="exam"><span class="ic" aria-hidden="true">✎</span> Exam centre</a>
      <a href="#/bounties"    data-nav="bounties"><span class="ic" aria-hidden="true">✸</span> Bug bounties</a>

      <div class="sep">Progress</div>
      <a href="#/quests/12"   data-nav="quests"><span class="ic" aria-hidden="true">◈</span> Missions</a>
      <a href="#/project"     data-nav="project"><span class="ic" aria-hidden="true">◳</span> Major project</a>
      <a href="#/diagnostics" data-nav="diagnostics"><span class="ic" aria-hidden="true">◎</span> Diagnostics</a>
      <a href="#/profile"     data-nav="profile"><span class="ic" aria-hidden="true">◆</span> Profile</a>
    </nav>

    <div class="railfoot">
      <div class="card tight" style="padding:12px 14px">
        <div class="eyebrow" id="rail-rank-label">Rank</div>
        <div style="font-weight:700;font-size:15px" id="rail-rank">Initiate</div>
        <div class="bar thin" style="margin-top:7px"><i id="rail-bar" style="width:0%"></i></div>
        <div class="small muted" style="margin-top:5px" id="rail-xp">0 XP</div>
      </div>
      <a href="#/settings" class="nav" data-nav="settings" style="padding:8px 12px;border-radius:12px;color:var(--ink-3);text-decoration:none;font-size:13px">⚙ Settings</a>
    </div>
  </aside>

  <!-- ------------------------------------------------------ content -->
  <main id="main" tabindex="-1">
    <header class="mobilebar glass">
      <div class="brand" style="padding:0;gap:9px">
        <div class="mark" style="width:30px;height:30px;border-radius:10px;font-size:13px" aria-hidden="true">SE</div>
        <div><b style="font-size:13px">SE Ops</b></div>
      </div>
      <div class="row" style="gap:7px">
        <span class="chip" id="m-rank">Initiate</span>
        <span class="chip accent" id="m-xp">0 XP</span>
        <a class="btn sm ghost" href="#/settings">⚙</a>
      </div>
    </header>
  </main>
</div>

<!-- ---------------------------------------------------- mobile tabs -->
<nav class="tabbar glass" aria-label="Primary">
  <a href="#/dashboard"   data-nav="dashboard"><span class="ic" aria-hidden="true">◉</span>Home</a>
  <a href="#/syllabus"    data-nav="syllabus"><span class="ic" aria-hidden="true">▤</span>Syllabus</a>
  <a href="#/lab"         data-nav="lab"><span class="ic" aria-hidden="true">⌨</span>Lab</a>
  <a href="#/exam"        data-nav="exam"><span class="ic" aria-hidden="true">✎</span>Exams</a>
  <a href="#/quests/12"   data-nav="quests"><span class="ic" aria-hidden="true">◈</span>Missions</a>
  <a href="#/profile"     data-nav="profile"><span class="ic" aria-hidden="true">◆</span>Profile</a>
</nav>

<div class="toasts" aria-live="polite" aria-atomic="false"></div>

<!-- data -->
<script src="js/data/syllabus.js"></script>
<script src="js/data/diagrams.js"></script>
<script src="js/data/notes.js"></script>
<script src="js/data/questions.js"></script>
<script src="js/data/questions-b.js"></script>
<script src="js/data/questions-c.js"></script>
<script src="js/data/quests.js"></script>
<script src="js/data/portfolio.js"></script>
<!-- engine -->
<script src="js/state.js"></script>
<script src="js/runtime.js"></script>
<script src="js/uml.js"></script>
<script src="js/marking.js"></script>
<script src="js/ui.js"></script>
<!-- views -->
<script src="js/views/learn.js"></script>
<script src="js/views/code.js"></script>
<script src="js/views/exam.js"></script>
<script src="js/views/project.js"></script>
<script src="js/views/ops.js"></script>
<!-- boot -->
<script src="js/app.js"></script>
</body>
</html>
